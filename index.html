<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<title>VetShelf</title>
<style>
:root{--bg:#F2F7F6;--sf:#fff;--tx:#0F1F1D;--mu:#5E706D;--pr:#0F766E;--on:#fff;--pc:#D2F0EA;--ol:#DCE6E4;--rd:#E11D48;--sh:0 1px 2px rgba(15,31,29,.06),0 6px 16px rgba(15,31,29,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1413;--sf:#142120;--tx:#E6F1EF;--mu:#92A9A5;--pr:#2DD4BF;--on:#04211E;--pc:#12423D;--ol:#223533;--rd:#FB7185;--sh:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme=dark]{--bg:#0B1413;--sf:#142120;--tx:#E6F1EF;--mu:#92A9A5;--pr:#2DD4BF;--on:#04211E;--pc:#12423D;--ol:#223533;--rd:#FB7185;--sh:0 1px 2px rgba(0,0,0,.3)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:Roboto,"Segoe UI",system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.ic{width:24px;height:24px;fill:currentColor;flex:none}
#bar{display:flex;align-items:center;gap:6px;padding:14px 14px 8px;min-height:84px}
#bar .t{flex:1;min-width:0}
#bar small{display:block;color:var(--mu);font-size:13px;letter-spacing:.2px}
#bar h1{margin:2px 0 0;font-size:27px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{width:42px;height:42px;border-radius:50%;display:none;align-items:center;justify-content:center;background:var(--sf);box-shadow:var(--sh)}
#back.on{display:flex;animation:pop .3s}
#main{flex:1;overflow-y:auto;padding:6px 16px 170px;scrollbar-width:none}
#main::-webkit-scrollbar{display:none}
.a-r{animation:inR .35s cubic-bezier(.2,.8,.2,1)}.a-l{animation:inL .35s cubic-bezier(.2,.8,.2,1)}.a-f{animation:fade .3s}
@keyframes inR{from{opacity:0;transform:translateX(34px)}}
@keyframes inL{from{opacity:0;transform:translateX(-34px)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.98)}}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.it{animation:up .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.rip{position:relative;overflow:hidden;transition:transform .15s}
.rip:active{transform:scale(.97)}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.14;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
.hero{border-radius:26px;padding:20px;color:#fff;background:linear-gradient(135deg,#0F766E,#0EA5A0 70%,#34D399);box-shadow:0 10px 24px rgba(15,118,110,.3);margin-bottom:18px;position:relative}
.hero small{opacity:.85;font-size:12px;letter-spacing:.8px;text-transform:uppercase}
.hero b{display:block;font-size:20px;margin:6px 0 4px;line-height:1.25}
.hero span{opacity:.9;font-size:14px}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14)}
.sec{font-size:13px;font-weight:600;color:var(--mu);margin:4px 4px 10px;letter-spacing:.4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--sf);border-radius:22px;box-shadow:var(--sh);color:var(--tx)}
.sc{padding:16px;min-height:140px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;cursor:pointer}
.av{width:44px;height:44px;border-radius:15px;background:var(--c);color:#fff;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;position:absolute;left:16px;top:16px}
.sc b{font-size:16px;display:block;margin-bottom:3px;word-break:break-word}
.sc small,.row small{color:var(--mu);font-size:12.5px}
.mb{position:absolute;right:6px;top:6px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mu)}
.row{display:flex;align-items:center;gap:14px;padding:14px 12px 14px 14px;margin-bottom:10px;cursor:pointer;position:relative}
.row .tx{flex:1;min-width:0}
.row b{display:block;font-size:15.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mb{position:static;flex:none}
.bd{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:var(--pc);color:var(--pr);font-weight:700;flex:none}
.bd.r{background:#FDE4E8;color:#E11D48}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .bd.r{background:#3A1820;color:#FB7185}}
.empty{text-align:center;color:var(--mu);padding:50px 24px;animation:up .5s both}
.empty .ic{width:56px;height:56px;color:var(--pr);opacity:.5;margin-bottom:8px}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--mu);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;transition:all .25s}
.done .ck{background:var(--pr);border-color:var(--pr);color:var(--on);animation:pop .3s}
.done b{text-decoration:line-through;color:var(--mu)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mu);margin-right:8px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--pr))}
.chip.od{color:var(--rd);font-weight:600}
.txt{color:var(--pr);font-weight:600;padding:12px 16px;display:block;margin:6px auto}
#fab{position:absolute;right:18px;bottom:96px;width:58px;height:58px;border-radius:19px;background:var(--pr);color:var(--on);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(15,118,110,.4);transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;z-index:5}
#fab.off{transform:scale(0);opacity:0;pointer-events:none}
#fab:active{transform:scale(.9)}
#nav{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--sf);display:flex;justify-content:space-around;align-items:center;padding:0 10px;box-shadow:0 -2px 16px rgba(15,31,29,.08);z-index:6;border-radius:24px 24px 0 0}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mu);font-weight:500}
#nav .pl{width:62px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:background .3s,width .3s}
#nav button.on{color:var(--tx);font-weight:700}
#nav button.on .pl{background:var(--pc);color:var(--pr)}
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:10}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sf);border-radius:28px 28px 0 0;padding:10px 22px 26px;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.2,1);z-index:11;max-height:85%;overflow-y:auto}
#sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--ol);margin:0 auto 14px}
#sheet h3{margin:0 0 14px;font-size:20px}
.fld{display:block;margin-bottom:14px}
.fld span,.lbl{display:block;font-size:12.5px;color:var(--mu);margin-bottom:6px;font-weight:500}
.fld input,.fld select{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--ol);background:var(--bg);outline:0;transition:border-color .2s}
.fld input:focus,.fld select:focus{border-color:var(--pr)}
.sh{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sw{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.dot{width:34px;height:34px;border-radius:50%;transition:transform .2s,box-shadow .2s}
.dot.on{transform:scale(1.15);box-shadow:0 0 0 3px var(--sf),0 0 0 5px var(--c)}
.act{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.btn{background:var(--pr);color:var(--on);padding:13px 26px;border-radius:24px;font-weight:600}
.btn.dg{background:var(--rd);color:#fff}
.btn.t{background:none;color:var(--pr)}
#toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,30px);background:#1E2D2B;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;transition:all .3s;z-index:20;max-width:85%;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#srch{width:42px;height:42px;border-radius:50%;background:var(--sf);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;flex:none}
#sb{display:none;padding:0 16px 8px}#sb.on{display:block;animation:fade .25s}
#sb input{width:100%;padding:14px 18px;border-radius:26px;border:1.5px solid var(--ol);background:var(--sf);outline:0;box-shadow:var(--sh)}#sb input:focus{border-color:var(--pr)}
.bd{position:relative}
.nb{position:absolute;left:-4px;top:-4px;min-width:22px;height:22px;border-radius:11px;background:#F5B700;color:#3B2A00;font:700 12px/22px Roboto,sans-serif;font-style:normal;text-align:center;padding:0 5px;box-shadow:0 2px 6px rgba(0,0,0,.25);animation:pop .4s}
.tg{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:10px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);margin:3px 6px 0 0}
.fl{display:flex;gap:8px;overflow-x:auto;margin:0 0 14px;padding:2px 2px 4px;scrollbar-width:none}.fl.wrap{flex-wrap:wrap}
.fc{flex:none;padding:8px 16px;border-radius:18px;background:var(--sf);border:1.5px solid var(--ol);font-size:13.5px;font-weight:500;transition:all .2s}.fc.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
.pc{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 14px}.pch{padding:6px 13px;font-size:12.5px}
.bk{padding:18px;margin-bottom:14px}.bk h4{margin:0 0 6px;font-size:17px}.bk p{margin:0 0 14px;color:var(--mu);font-size:14px;line-height:1.45}
.bk textarea{display:block;width:100%;height:96px;border-radius:14px;border:1.5px solid var(--ol);background:var(--bg);padding:12px;margin:0 0 12px;resize:none;outline:0;font-size:12px}#bt{display:none;margin-top:12px}
#nav{left:14px;right:14px;bottom:14px;height:68px;border-radius:26px;box-shadow:0 10px 30px rgba(15,31,29,.2)}
#fab{bottom:98px;border-radius:20px;background:linear-gradient(135deg,#0F766E,#14B8A6);color:#fff}
.sc{background:linear-gradient(165deg,var(--sf) 45%,color-mix(in srgb,var(--c) 18%,var(--sf)));border:1px solid color-mix(in srgb,var(--c) 22%,transparent)}
.sc:before{content:attr(data-l);position:absolute;right:-4px;bottom:-24px;font-size:96px;font-weight:800;color:var(--c);opacity:.1;pointer-events:none}
.av{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#fff));box-shadow:0 6px 14px color-mix(in srgb,var(--c) 40%,transparent)}
.row{border:1px solid var(--ol)}
.hero{overflow:hidden}.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-100%);animation:shn 3.5s 1.5s infinite}
@keyframes shn{to{transform:translateX(100%)}}
#splash{position:absolute;inset:0;z-index:50;background:linear-gradient(160deg,#0B5E58,#0F766E 55%,#14B8A6);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;animation:sp .6s 1.5s forwards}
#splash .lg{width:92px;height:92px;border-radius:28px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;animation:pop .7s cubic-bezier(.3,1.6,.5,1);box-shadow:0 0 0 14px rgba(255,255,255,.08)}
#splash .lg .ic{width:48px;height:48px}#splash b{font-size:28px;margin-top:22px;letter-spacing:.5px;animation:up .6s .3s both}#splash small{opacity:.8;margin-top:6px;animation:up .6s .5s both}
@keyframes sp{to{opacity:0;visibility:hidden}}
</style><script>window.addEventListener('error',function(e){var m=document.getElementById('main');if(m&&!m.innerHTML.trim())m.innerHTML='<pre style="white-space:pre-wrap;padding:16px;color:#f87171">Error: '+e.message+' (line '+e.lineno+')</pre>'})</script>

<body><div id="app">
<div id="bar"><button id="back" data-a="back" aria-label="Back"></button><div class="t"><small id="sub"></small><h1 id="title"></h1></div><button id='srch' data-a='srch' aria-label='Search'></button></div>
<div id='sb'><input id='q' type='search' autocomplete='off' placeholder='Search subjects, units, PDFs, tags…'></div>
<div id="main"></div>
<button id="fab" data-a="fab" aria-label="Add"></button>
<div id="nav"></div>
<div id='splash'><div class='lg'><svg class='ic' viewBox='0 0 24 24'><path d='M18 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V4a2 2 0 00-2-2zM6 4h5v8l-2.5-1.5L6 12z'/></svg></div><b>VetShelf</b><small>Your veterinary study companion</small></div><div id="scrim"></div><div id="sheet"></div><div id="toast"></div>
</div>
<script>
const IC={search:'M15.5 14h-.8l-.3-.3A6.5 6.5 0 109.5 16a6.5 6.5 0 004.2-1.6l.3.3v.8l5 5 1.5-1.5zm-6 0a4.5 4.5 0 110-9 4.5 4.5 0 010 9z',cloud:'M19.4 10A7.5 7.5 0 005 8.5 5.5 5.5 0 006 19.5h13a4.5 4.5 0 00.4-9.5z',back:'M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z',plus:'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z',more:'M12 8a2 2 0 100-4 2 2 0 000 4zm0 2a2 2 0 100 4 2 2 0 000-4zm0 6a2 2 0 100 4 2 2 0 000-4z',book:'M18 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V4a2 2 0 00-2-2zM6 4h5v8l-2.5-1.5L6 12z',check:'M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z',clock:'M12 2a10 10 0 100 20 10 10 0 000-20zm.5 5H11v6l5.2 3.2.8-1.3-4.5-2.7z',pdf:'M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zm-1 7V3.5L18.5 9z',chev:'M10 6L8.6 7.4 13.2 12l-4.6 4.6L10 18l6-6z',task:'M19 3h-4.2a3 3 0 00-5.6 0H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm-7 0a1 1 0 110 2 1 1 0 010-2zm-2 14l-4-4 1.4-1.4L10 14.2l6.6-6.6L18 9z'};
const ic=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
const $=s=>document.querySelector(s),COLORS=['#0F766E','#4F46E5','#E11D48','#D97706','#0284C7','#7C3AED','#16A34A'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const TAGS=['Main Book','Notes','Important','Viva','Practical'],TC={'Main Book':'#D97706',Notes:'#0284C7',Important:'#E11D48',Viva:'#7C3AED',Practical:'#16A34A'},tc=t=>TC[t]||COLORS[[...t].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
let S=null;try{S=JSON.parse(localStorage.getItem('vetshelf1'))}catch(e){}
if(!S)S={subjects:['Anatomy','Physiology','LPM'].map((n,i)=>({id:uid(),name:n,color:COLORS[i],units:[]})),tasks:[],history:[]};
const save=()=>{try{localStorage.setItem('vetshelf1',JSON.stringify(S))}catch(e){}};
let tab='lib',nav=[];
$('#back').innerHTML=ic('back');$('#srch').innerHTML=ic('search');$('#fab').innerHTML=ic('plus');
$('#nav').innerHTML=[['lib','book','Library'],['tasks','task','Tasks'],['hist','clock','History'],['bk','cloud','Backup']].map(t=>`<button data-tab="${t[0]}"><span class="pl">${ic(t[1])}</span>${t[2]}</button>`).join('');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2400)}
const ago=ts=>{const m=(Date.now()-ts)/6e4;if(m<1)return'Just now';if(m<60)return Math.floor(m)+' min ago';const h=m/60;if(h<24)return Math.floor(h)+' h ago';return new Date(ts).toLocaleDateString(undefined,{day:'numeric',month:'short'})};
const tm=ts=>new Date(ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const dayLbl=ts=>{const d=new Date(ts).toDateString();if(d===new Date().toDateString())return'Today';if(d===new Date(Date.now()-864e5).toDateString())return'Yesterday';return new Date(ts).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})};
const nP=s=>s.units.reduce((a,u)=>a+u.pdfs.length,0);
const empty=(i,t,s)=>`<div class="empty">${ic(i)}<div style="font-weight:600;color:var(--tx)">${t}</div><div style="margin-top:4px;font-size:14px">${s}</div></div>`;
let tf='',sq=null;
const pl=u=>u.pdfs.map((p,l)=>[p,l]).filter(x=>!tf||x[0].tag===tf).sort((a,b)=>(a[0].no||1e9)-(b[0].no||1e9)||a[1]-b[1]);
const tagBar=u=>{const T=[...new Set(u.pdfs.map(p=>p.tag).filter(Boolean))];return T.length?`<div class='fl'><button class='fc${tf?'':' on'}' data-a='tf' data-t=''>All</button>${T.map(t=>`<button class='fc${tf===t?' on':''}' data-a='tf' data-t='${esc(t)}'>${esc(t)}</button>`).join('')}</div>`:''};
function hideS(){sq=null;$('#sb').classList.remove('on');$('#q').value=''}
function renderQ(){const v=view();$('#sub').textContent=v.s;$('#main').innerHTML=v.h}
function sview(){const q=sq.trim().toLowerCase();
 if(!q){const T=[...new Set(S.subjects.flatMap(s=>s.units.flatMap(u=>u.pdfs.map(p=>p.tag).filter(Boolean))))];return{s:'Find anything',t:'Search',h:(T.length?`<div class='sec'>TAGS</div><div class='fl wrap'>${T.map(t=>`<button class='fc' data-a='qt' data-t='${esc(t)}'>${esc(t)}</button>`).join('')}</div>`:'')+empty('search','Search your library','Subjects, units, PDFs, tags and tasks')}}
 const R=[];
 S.subjects.forEach((s,i)=>{if(s.name.toLowerCase().includes(q))R.push(['rs','Subject',s.name,'',i,0,0,s.color]);
  s.units.forEach((u,j)=>{if(u.name.toLowerCase().includes(q))R.push(['ru','Unit',u.name,s.name,i,j,0,s.color]);
   u.pdfs.forEach((p,l)=>{if((p.title+' '+(p.tag||'')).toLowerCase().includes(q))R.push(['rp','PDF',p.title,s.name+' · '+u.name+(p.tag?' · '+p.tag:''),i,j,l,'#E11D48'])})})});
 S.tasks.forEach((t,i)=>{if(t.title.toLowerCase().includes(q))R.push(['rt','Task',t.title,t.done?'Done':'To do',i,0,0,'#0F766E'])});
 return{s:R.length+' results',t:'Search',h:R.length?R.map(r=>`<div class='card row rip' data-a='${r[0]}' data-i='${r[4]}' data-j='${r[5]}' data-l='${r[6]}'><div class='bd' style='background:${r[7]}22;color:${r[7]}'>${r[1][0]}</div><div class='tx'><b>${esc(r[2])}</b><small>${r[1]}${r[3]?' · '+esc(r[3]):''}</small></div></div>`).join(''):empty('search','No results','Try another word')}}
function bview(){const np=S.subjects.reduce((a,s)=>a+nP(s),0);
 return{s:'Keep your data safe',t:'Backup',h:`<div class='hero it'><small>Your data</small><b>${S.subjects.length} subjects · ${np} PDFs · ${S.tasks.length} tasks</b><span>Stored on this device only</span></div><div class='card bk it' style='--d:60ms'><h4>Back up</h4><p>Copy your whole library as text and save it somewhere safe, like a saved chat, Notes or Drive.</p><button class='btn' data-a='bcopy'>Copy backup</button><textarea id='bt' readonly></textarea></div><div class='card bk it' style='--d:120ms'><h4>Restore</h4><p>Paste a backup below. This replaces everything currently in the app.</p><textarea id='rt' placeholder='Paste backup here…'></textarea><button class='btn' data-a='brest'>Restore</button></div>`}}
const stag=k=>`style="--d:${Math.min(k,10)*45}ms"`;

function view(){
 if(sq!==null)return sview();if(tab==='bk')return bview();
 const h=new Date().getHours(),g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
 if(tab==='lib'){
  if(!nav.length){
   const L=S.history[0],np=S.subjects.reduce((a,s)=>a+nP(s),0);
   let x=L?`<div class="hero rip it" data-a="hs" data-i="0"><small>Continue reading</small><b>${esc(L.title)}</b><span>${esc(L.sub)} · ${esc(L.unit)}</span></div>`:`<div class="hero it"><small>Your study shelf</small><b>${S.subjects.length} subjects, ${np} PDFs</b><span>Add units and PDFs to get started</span></div>`;
   x+=`<div class="sec">SUBJECTS</div>`;
   x+=S.subjects.length?`<div class="grid">`+S.subjects.map((s,i)=>`<div class="card sc rip it" ${stag(i+1)} data-l="${esc(s.name.trim()[0]||'?').toUpperCase()}" data-a="os" data-i="${i}" style="--c:${s.color}"><div class="av">${esc(s.name.trim()[0]||'?').toUpperCase()}</div><button class="mb" data-a="more" data-k="s" data-i="${i}" aria-label="Options">${ic('more')}</button><b>${esc(s.name)}</b><small>${s.units.length} units · ${nP(s)} PDFs</small></div>`).join('')+`</div>`:empty('book','No subjects yet','Tap + to add your first subject');
   return{s:g+' 👋',t:'My Library',h:x}}
  const s=S.subjects[nav[0]];
  if(nav.length===1)return{s:s.units.length+' units · '+nP(s)+' PDFs',t:s.name,h:s.units.length?s.units.map((u,j)=>`<div class="card row rip it" ${stag(j)} data-a="ou" data-i="${j}"><div class="bd" style="background:${s.color}22;color:${s.color}">${j+1}</div><div class="tx"><b>${esc(u.name)}</b><small>${u.pdfs.length} PDFs</small></div><button class="mb" data-a="more" data-k="u" data-i="${j}" aria-label="Options">${ic('more')}</button></div>`).join(''):empty('book','No units yet','Tap + to add a unit or chapter')};
  const u=s.units[nav[1]];
  return{s:s.name,t:u.name,h:tagBar(u)+(u.pdfs.length?pl(u).map(([p,l])=>`<div class="card row rip it" ${stag(l)} data-a="op" data-i="${l}"><div class="bd r">${ic('pdf')}${p.no?`<i class='nb'>${p.no}</i>`:''}</div><div class="tx"><b>${esc(p.title)}</b>${p.tag?`<span class='tg' style='--c:${tc(p.tag)}'>${esc(p.tag)}</span>`:''}<small>${p.last?'Opened '+ago(p.last):'Not opened yet'}${p.url?'':' · no link'}</small></div><button class="mb" data-a="more" data-k="p" data-i="${l}" aria-label="Options">${ic('more')}</button></div>`).join(''):empty('pdf','No PDFs here','Tap + to add a PDF link'))};
 }
 if(tab==='tasks'){
  const row=(t,i,k)=>{const sb=S.subjects.find(s=>s.id===t.sid),od=t.due&&!t.done&&new Date(t.due+'T23:59:59')<new Date();
   return`<div class="card row it ${t.done?'done':''}" ${stag(k)}><button class="ck" data-a="tg" data-i="${i}" aria-label="Toggle">${ic('check')}</button><div class="tx" data-a="tg" data-i="${i}"><b>${esc(t.title)}</b><div>${sb?`<span class="chip" style="--c:${sb.color}"><i></i>${esc(sb.name)}</span>`:''}${t.due?`<span class="chip ${od?'od':''}">${new Date(t.due+'T00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}</span>`:''}</div></div><button class="mb" data-a="more" data-k="t" data-i="${i}" aria-label="Options">${ic('more')}</button></div>`};
  const P=S.tasks.map((t,i)=>[t,i]).filter(x=>!x[0].done),D=S.tasks.map((t,i)=>[t,i]).filter(x=>x[0].done);
  let x=S.tasks.length?'':empty('task','No tasks','Tap + to plan your study');
  if(P.length)x+=`<div class="sec">TO DO · ${P.length}</div>`+P.map((a,k)=>row(a[0],a[1],k)).join('');
  if(D.length)x+=`<div class="sec" style="margin-top:14px">DONE · ${D.length}</div>`+D.map((a,k)=>row(a[0],a[1],k)).join('');
  return{s:P.length?P.length+' pending':'All caught up',t:'Tasks',h:x}}
 let x='',last='',k=0;
 S.history.forEach((e,i)=>{const d=dayLbl(e.ts);if(d!==last){x+=`<div class="sec" style="margin-top:6px">${d.toUpperCase()}</div>`;last=d}
  x+=`<div class="card row rip it" ${stag(k++)} data-a="hs" data-i="${i}"><div class="bd r">${ic('pdf')}</div><div class="tx"><b>${esc(e.title)}</b><small>${esc(e.sub)} · ${esc(e.unit)} · ${tm(e.ts)}</small></div></div>`});
 x=S.history.length?x+`<button class="txt" data-a="clr">Clear history</button>`:empty('clock','No history yet','PDFs you open will show up here');
 return{s:S.history.length+' opened',t:'History',h:x}}

function render(a='a-f'){
 const v=view(),m=$('#main');
 $('#sub').textContent=v.s;$('#title').textContent=v.t;
 $('#back').classList.toggle('on',(tab==='lib'&&nav.length>0)||sq!==null);
 m.classList.remove('a-r','a-l','a-f');void m.offsetWidth;m.innerHTML=v.h;m.classList.add(a);m.scrollTop=0;
 $('#fab').classList.toggle('off',tab==='hist'||tab==='bk'||sq!==null);
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
}

let VN=null;try{VN=(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.VetNative)||null}catch(e){}
function launch(u){
 if(!u)return toast('No file or link saved. Edit this PDF to add one.');
 if(VN){VN.open({uri:u}).catch(()=>toast('Could not open this PDF'));return}
 try{window.open(u,'_blank')}catch(e){toast('That link doesn’t look valid')}
}
function log(p,sub,unit){
 p.last=Date.now();S.history.unshift({id:uid(),title:p.title,sub,unit,url:p.url,ts:p.last});S.history=S.history.slice(0,150);save();launch(p.url)}

function sheet(title,fields,ok,del,label){
 const el=$('#sheet');let h=`<div class="grab"></div><h3>${title}</h3>`;
 fields.forEach(f=>{
  if(f.t==='color')h+=`<div class="lbl">${f.l}</div><div class="sw">${COLORS.map(c=>`<button type="button" class="dot${c===(f.v||COLORS[0])?' on':''}" data-c="${c}" style="background:${c};--c:${c}"></button>`).join('')}</div>`;
  else if(f.t==='chips')h+=`<label class="fld"><span>${f.l}</span><input id="f_${f.k}" autocomplete="off" placeholder="Pick below or type your own" value="${esc(f.v||'')}"></label><div class="pc">${TAGS.map(t=>`<button type="button" class="fc pch" data-k="${f.k}" data-v="${t}">${t}</button>`).join('')}</div>`;
  else if(f.t==='select')h+=`<label class="fld"><span>${f.l}</span><select id="f_${f.k}">${f.o.map(o=>`<option value="${o[0]}">${esc(o[1])}</option>`).join('')}</select></label>`;
  else h+=`<label class="fld"><span>${f.l}</span><input id="f_${f.k}" type="${f.t||'text'}" autocomplete="off" placeholder="${esc(f.p||'')}" value="${esc(f.v||'')}"></label>`+(f.pick&&VN?`<button type="button" class="btn t pk" style="margin:-6px 0 12px;padding:8px 4px">📂 Choose PDF from phone</button>`:'')});
 h+=`<div class="act">${del?'<button class="btn dg" id="sd">Delete</button>':''}<button class="btn t" id="sx">Cancel</button><button class="btn" id="so">${label||'Save'}</button></div>`;
 el.innerHTML=h;el.classList.add('on');$('#scrim').classList.add('on');
 const close=()=>{el.classList.remove('on');$('#scrim').classList.remove('on')};sheet.close=close;
 $('#sx').onclick=close;el.querySelectorAll('.pch').forEach(c=>c.onclick=()=>{$('#f_'+c.dataset.k).value=c.dataset.v});el.querySelectorAll('.pk').forEach(b=>b.onclick=async()=>{try{const r=await VN.pick();$('#f_u').value=r.uri;if(!$('#f_n').value)$('#f_n').value=String(r.name||'').replace(/\.pdf$/i,'')}catch(e){}});if(del)$('#sd').onclick=()=>{del();save();close();render()};
 el.querySelectorAll('.dot').forEach(d=>d.onclick=()=>{el.querySelectorAll('.dot').forEach(x=>x.classList.remove('on'));d.classList.add('on')});
 $('#so').onclick=()=>{const v={};fields.forEach(f=>{v[f.k]=f.t==='color'?el.querySelector('.dot.on').dataset.c:$('#f_'+f.k).value.trim()});
  const f0=$('#f_'+fields[0].k);if(f0&&!v[fields[0].k]){f0.parentNode.classList.remove('sh');void f0.offsetWidth;f0.parentNode.classList.add('sh');f0.focus();return}
  ok(v);save();close();render()};
 const f0=$('#f_'+fields[0].k);if(f0&&!f0.value)setTimeout(()=>f0.focus(),350);
}
$('#scrim').onclick=()=>sheet.close&&sheet.close();

function more(k,i){
 const s=S.subjects[nav[0]],u=s&&s.units[nav[1]];
 if(k==='s'){const o=S.subjects[i];sheet('Edit subject',[{k:'n',l:'Subject name',v:o.name},{k:'c',t:'color',l:'Colour',v:o.color}],v=>{o.name=v.n;o.color=v.c},()=>S.subjects.splice(i,1))}
 if(k==='u'){const o=s.units[i];sheet('Edit unit',[{k:'n',l:'Unit name',v:o.name}],v=>{o.name=v.n},()=>s.units.splice(i,1))}
 if(k==='p'){const o=u.pdfs[i];sheet('Edit PDF',[{k:'n',l:'Title',v:o.title},{k:'t',t:'chips',l:'Tag',v:o.tag},{k:'o',t:'number',l:'Priority number (1 shows first)',v:o.no},{k:'u',l:'PDF link or file',v:o.url,p:'Paste a link, or choose from phone',pick:1}],v=>{o.title=v.n;o.url=v.u;o.tag=v.t;o.no=v.o?+v.o:''},()=>u.pdfs.splice(i,1))}
 if(k==='t'){const o=S.tasks[i];sheet('Edit task',[{k:'n',l:'Task',v:o.title}],v=>{o.title=v.n},()=>S.tasks.splice(i,1))}
}
function add(){
 if(tab==='tasks')return sheet('New task',[{k:'n',l:'Task',p:'e.g. Revise osteology'},{k:'s',t:'select',l:'Subject',o:[['','None']].concat(S.subjects.map(s=>[s.id,s.name]))},{k:'d',t:'date',l:'Due date (optional)'}],v=>S.tasks.unshift({id:uid(),title:v.n,sid:v.s,due:v.d,done:false}),null,'Add');
 if(!nav.length)return sheet('New subject',[{k:'n',l:'Subject name',p:'e.g. Pharmacology'},{k:'c',t:'color',l:'Colour'}],v=>S.subjects.push({id:uid(),name:v.n,color:v.c,units:[]}),null,'Add');
 const s=S.subjects[nav[0]];
 if(nav.length===1)return sheet('New unit',[{k:'n',l:'Unit name',p:'e.g. Unit 1 · Osteology'}],v=>s.units.push({id:uid(),name:v.n,pdfs:[]}),null,'Add');
 const u=s.units[nav[1]];
 sheet('Add PDF',[{k:'n',l:'Title',p:'e.g. Chapter 3 notes'},{k:'t',t:'chips',l:'Tag'},{k:'o',t:'number',l:'Priority number (1 shows first)',p:'1, 2, 3…'},{k:'u',l:'PDF link or file',p:'Paste a link, or choose from phone',pick:1}],v=>u.pdfs.push({id:uid(),title:v.n,url:v.u,tag:v.t,no:v.o?+v.o:'',last:0}),null,'Add');
}

document.addEventListener('pointerdown',e=>{const r=e.target.closest('.rip');if(!r)return;const b=r.getBoundingClientRect(),d=Math.max(b.width,b.height)*2,s=document.createElement('span');s.className='rp';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-b.left-d/2}px;top:${e.clientY-b.top-d/2}px`;r.appendChild(s);setTimeout(()=>s.remove(),600)});
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab]');
 if(t){const was=sq!==null;hideS();if(tab!==t.dataset.tab||was){tab=t.dataset.tab;nav=[];tf='';render('a-f')}return}
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j,l=+b.dataset.l;
 if(a==='srch'){sq='';$('#sb').classList.add('on');render('a-f');$('#q').focus()}else if(a==='qt'){sq=b.dataset.t;$('#q').value=sq;renderQ()}else if(a==='rs'||a==='ru'){hideS();tab='lib';nav=a==='rs'?[i]:[i,j];tf='';render('a-r')}else if(a==='rp'){const s=S.subjects[i],u=s.units[j];log(u.pdfs[l],s.name,u.name);hideS();tab='lib';nav=[i,j];tf='';render('a-r')}else if(a==='rt'){hideS();tab='tasks';nav=[];render('a-f')}else if(a==='tf'){tf=b.dataset.t;render('a-f')}else if(a==='bcopy'){const t=JSON.stringify({v:1,d:S}),x=$('#bt');x.value=t;x.style.display='block';x.select();try{navigator.clipboard.writeText(t).then(()=>toast('Backup copied'),()=>toast('Select the text and copy it'))}catch(e){toast('Select the text and copy it')}}else if(a==='brest'){if(!b.dataset.c){b.dataset.c=1;b.textContent='Tap again to confirm';return}try{const d=JSON.parse($('#rt').value).d;if(!d||!Array.isArray(d.subjects))throw 0;S={subjects:d.subjects,tasks:d.tasks||[],history:d.history||[]};save();toast('Backup restored');render('a-f')}catch(e){toast('That isn’t a valid backup');b.dataset.c='';b.textContent='Restore'}}else if(a==='os'){nav=[i];render('a-r')}
 else if(a==='ou'){nav=[nav[0],i];tf='';render('a-r')}
 else if(a==='back'){if(sq!==null)hideS();else nav.pop();render('a-l')}
 else if(a==='op'){const s=S.subjects[nav[0]],u=s.units[nav[1]];log(u.pdfs[i],s.name,u.name);render('a-f')}
 else if(a==='hs'){const h=S.history[i];S.history.splice(i,1);S.history.unshift({...h,id:uid(),ts:Date.now()});save();launch(h.url);render('a-f')}
 else if(a==='tg'){S.tasks[i].done=!S.tasks[i].done;save();render('a-f')}
 else if(a==='more')more(b.dataset.k,i);
 else if(a==='clr'){S.history=[];save();render('a-f')}
 else if(a==='fab')add();
});
render('a-f');
$('#q').addEventListener('input',e=>{sq=e.target.value;renderQ()});
</script></body></html>
