<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<title>VetShelf</title>
<style>
:root{--bg:#F2F7F6;--sf:#fff;--tx:#0F1F1D;--mu:#5E706D;--pr:#0F766E;--on:#fff;--pc:#D2F0EA;--ol:#DCE6E4;--rd:#E11D48;--sh:0 1px 2px rgba(15,31,29,.06),0 6px 16px rgba(15,31,29,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1413;--sf:#142120;--tx:#E6F1EF;--mu:#92A9A5;--pr:#2DD4BF;--on:#04211E;--pc:#12423D;--ol:#223533;--rd:#FB7185;--sh:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme=dark]{--bg:#0B1413;--sf:#142120;--tx:#E6F1EF;--mu:#92A9A5;--pr:#2DD4BF;--on:#04211E;--pc:#12423D;--ol:#223533;--rd:#FB7185;--sh:0 1px 2px rgba(0,0,0,.3)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:Roboto,"Segoe UI",system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.ic{width:24px;height:24px;fill:currentColor;flex:none}
#bar{display:flex;align-items:center;gap:6px;padding:14px 14px 8px;min-height:84px}
#bar .t{flex:1;min-width:0}
#bar small{display:block;color:var(--mu);font-size:13px;letter-spacing:.2px}
#bar h1{margin:2px 0 0;font-size:27px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{width:42px;height:42px;border-radius:50%;display:none;align-items:center;justify-content:center;background:var(--sf);box-shadow:var(--sh)}
#back.on{display:flex;animation:pop .3s}
#main{flex:1;overflow-y:auto;padding:6px 16px 170px;scrollbar-width:none}
#main::-webkit-scrollbar{display:none}
.a-r{animation:inR .35s cubic-bezier(.2,.8,.2,1)}.a-l{animation:inL .35s cubic-bezier(.2,.8,.2,1)}.a-f{animation:fade .3s}
@keyframes inR{from{opacity:0;transform:translateX(34px)}}
@keyframes inL{from{opacity:0;transform:translateX(-34px)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.98)}}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.it{animation:up .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.rip{position:relative;overflow:hidden;transition:transform .15s}
.rip:active{transform:scale(.97)}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.14;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
.hero{border-radius:26px;padding:20px;color:#fff;background:linear-gradient(135deg,#0F766E,#0EA5A0 70%,#34D399);box-shadow:0 10px 24px rgba(15,118,110,.3);margin-bottom:18px;position:relative}
.hero small{opacity:.85;font-size:12px;letter-spacing:.8px;text-transform:uppercase}
.hero b{display:block;font-size:20px;margin:6px 0 4px;line-height:1.25}
